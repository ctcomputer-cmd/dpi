name: Build Android APK

# Runs on push to main, or manually from the Actions tab.
# Requires two repository secrets (Settings → Secrets and variables → Actions):
#   SUPABASE_URL        - Project URL (public)
#   SUPABASE_ANON_KEY   - anon public key (public, but kept as a secret anyway)
#   KEYSTORE_BASE64     - base64 of dpi-release.jks (permanent release signing key)
#   KEYSTORE_PASSWORD   - keystore + key password
#   KEY_ALIAS           - key alias (dpi)
# Without the three KEYSTORE/KEY secrets the APK is signed with the debug key.
# Never store the service_role key here.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: bash scripts/bootstrap_android.sh

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dpi-department-hub-release
          path: build/app/outputs/flutter-apk/app-release.apk
