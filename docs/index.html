<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DPI Department Hub</title>
  <style>
    :root { --primary:#142D4E; --bg:#F5F7FA; --text:#1f2937; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f172a; --text:#e5e7eb; }
    }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
    main { max-width:420px; padding:24px; text-align:center; }
    h1 { color:var(--primary); font-size:1.4rem; margin:0 0 12px; }
    p { line-height:1.6; margin:8px 0; }
    .small { font-size:.9rem; opacity:.75; }
  </style>
</head>
<body>
  <main>
    <h1>DPI Department Hub</h1>
    <p><strong>আপনার অ্যাকাউন্ট তৈরি হয়েছে / Your account is ready.</strong></p>
    <p>এখন মোবাইলে DPI Department Hub অ্যাপটি খুলে আপনার ইমেইল ও পাসওয়ার্ড দিয়ে লগইন করুন।</p>
    <p class="small">Open the DPI Department Hub app on your phone and sign in with your email and password.</p>
    <p class="small">Daffodil Polytechnic Institute</p>
  </main>
</body>
</html>
